name: matematicarag

services:
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: matematicarag-qdrant
    restart: always
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - matematicarag-net

  qdrant-init:
    image: curlimages/curl:latest
    container_name: matematicarag-qdrant-init
    depends_on:
      qdrant:
        condition: service_healthy
    entrypoint: >
      sh -c "
        echo 'Creating Qdrant collection...' &&
        curl -s -X PUT http://qdrant:6333/collections/matematicarag_chunks -H 'Content-Type: application/json' -d '{
          \"vectors\": {
            \"size\": 1536,
            \"distance\": \"Cosine\"
          }
        }' &&
        echo '' &&
        echo 'Collection created successfully'
      "
    networks:
      - matematicarag-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: matematicarag-backend
    restart: always
    depends_on:
      qdrant:
        condition: service_healthy
      qdrant-init:
        condition: service_completed_successfully
    environment:
      PORT: "8009"
      DB_URL: ${DB_URL:?ERROR: DB_URL is required}
      JWT_SECRET: ${JWT_SECRET:?ERROR: JWT_SECRET is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?ERROR: OPENAI_API_KEY is required}
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6334"
      EMBEDDING_TYPE: openai
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - matematicarag-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: matematicarag-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8008:8008"
    networks:
      - matematicarag-net
      - dokploy-network

volumes:
  qdrant_data:
    name: matematicarag-qdrant-data

networks:
  matematicarag-net:
    name: matematicarag-network
    driver: bridge
  dokploy-network:
    external: true
    name: dokploy-network
